[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "era5-pull-pipeline"
version = "0.1.0"
description = "Command-line tools for a global ERA5 archive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5netcdf[h5py]>=1.8,<2",
    "multiurl>=0.3.9,<0.4",
    "numpy>=1.26",
    "portalocker>=3,<4",
    "rasterio>=1.4,<2",
    "requests>=2.31,<3",
    "tqdm>=4.66,<5",
    "xarray>=2025.3.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
convert = ["zarr>=3.1,<4"]

[project.scripts]
era5-pull = "era5_pull_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
